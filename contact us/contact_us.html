<!DOCTYPE html>
<html>
    <head>
        <title>Contact Us</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="contact_us.css">
        <link rel="stylesheet" href="../navbar/navbar.css">
    </head>
    <body>

        <nav class="navbar">
            <div class="nav-left">
                <a href="../home/home.html" class="nav-logo"><img src="../img/logo.PNG"></a>
                <div class="nav-links">
                    <a href="../home/home.html">Home</a>
                    <a href="../product/product.html">Products</a>
                    <a href="../aboutus/aboutus.html">About Us</a>
                    <a href="../contact us/contact_us.html">Contact</a>
                </div>
            </div>

            <div class="nav-right">
                <a href="../order/order.html"><img class="order-icon" src="../img/shopping-cart.png"> </a>
                <button class="account-btn" id="accountBtn"><img class="account-icon" src="../img/user1.png"></button>

                <div class="dropdown" id="dropdown">

                    <div id="loggedInDropdown">
                        <div class="dropdown-header">
                            Welcome Back <strong id="userName">Name</strong>
                        </div>
                        <a class="dropdown-item" href="../profile/profile.html">My Profile</a>
                        <a class="dropdown-item" href="../order history/order_history.html">Order History</a>
                        <a class="dropdown-item logout" href="../login/login.html" onclick="logout()">Logout</a>
                    </div> 
                    <div id="loggedOutDropdown">
                        <a class="dropdown-item" href="../login/login.html">Login</a>
                        <a class="dropdown-item" href="../register/register.html">Register</a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="Contact-page">
            <div class="contact-page">

            <div class="contact-left">

                <h1>Get in Touch</h1>
                <p class="tagline">We'd love to hear from you!</p>
                <p class="description">If you have any inquiries or just want to say hi, please use the contact form!</p>
                
                <div class="contact-details">

                    <div class="info-item">
                        <span class="info-icon">✉</span>
                        <a href="mailto:mscafe@gmail.comm">mscafe@gmail.com</a>
                    </div>

                </div>
            </div>

            <div class="contact-right">
                <form action="#">

                    <div class="form-row">
                        
                        <div class="input-group">
                            <label class="label" for="fname">First Name</label>
                            <input type="text" id="fname" name="fname" required>
                        </div>

                        <div class="input-group">
                            <label class="label" for="lname">Last Name</label>
                            <input type="text" id="lname" name="lname" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="label" for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label class="label" for="message">Message</label>
                        <textarea id="message" name="massage" required></textarea>
                    </div>

                    <div class="btn-wrapper">
                        <button type="submit" class="btn-primary">Send</button>
                    </div>

                </form>

            </div>

        </div>
        
        <script src="../navbar/navbar.js"></script>
        <script src="../contact us/contact_us.js"></script>
        
    </body>
</html>
