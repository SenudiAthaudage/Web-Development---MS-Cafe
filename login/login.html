<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="login-container">
            
            <div class="image-section">
                <img src="image/freepik__closeup-cafe-portrait-of-coffee-vibrant-fruit-drin__19888.png">
                <div class="image-overlay">
                    <p class="image-tagline">"Every cup tells a story."</p>
                </div>
            </div>

            <div class="form-section">

                <div class="logo-container">
                <a href="../home/home.html"><img class="logoimg" src="../img/logo1.png" alt="MScafe"></a>
            </div>

                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to your account to continue</p>

                <form id="loginForm" class="login-form">

                    <div class="input-group">
                        <label class="label" for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label class="label" for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>

                </form>

                <p class="switch-link">Don't have an account? <a href="../register/register.html"><b>Register here</b></a></p>
            </div>

        </div>

        <script src="login.js"></script>
    </body>
</html>
