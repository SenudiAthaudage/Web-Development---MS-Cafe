<!DOCTYPE html>
<html>
    <head>
        <title>
            Login
        </title>
        <style>
            body{
                font-family: Arial, sans-serif;
                font-size: 16px;
                line-height: 1.8;
                font-weight: normal;
                background: #f8f9fd;
                display:flex;
                justify-content: center;
                align-items: center;
                height:100vh;
                
            }
            .login-container {
                background-color: #fff;
                padding: 53px;
                border-radius: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 300px;
                
            }
            .img{
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center center;
            }
            h3{
                margin-bottom: 1.5rem;
                line-height: 1.5;
                font-weight: 400;
                
            }
            
            .label{
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 700;
            }
            input{
                height: 30px;
                background: #fff;
                
                font-size: 16px;
            }
            p{
                text-align: left;
            }
            .input-group {
                margin-bottom: 1.5rem;
                text-align: left;
                position: relative;
            }
            .input-group label {
                margin-bottom: 10px;
                color: #555;
            }
            .input-group input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            button {
                width: 107%;
                padding: 10px;
                border: none;
                border-radius: 4px;
                background-color: #007bff;
                color: #fff;
                font-size: 1em;
                cursor: pointer;
            }

            button:hover {
                background-color: #0056b3;
            }
            .color{
                color: cadetblue;
            }
            img{
                width: 100%;
                float: left;
                
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="img" style="background-image:url(image/freepik__closeup-cafe-portrait-of-coffee-vibrant-fruit-drin__19888.png)">
                <!--<img src="freepik__closeup-cafe-portrait-of-coffee-vibrant-fruit-drin__19888.png">-->
            </div>
            <div class="logo-container">
                <h4>Add logo design here</h4>
            </div>
            <h3>Sign In</h3>
            <!--<p>
                Welcome Back, Please log into your account
            </p>
            <p><span class="color">*</span>indicates required fields</p>-->
            <form action="#" class="login-form"></form>
            <div class="input-group">
                <label class="label"  for="username">USERNAME</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <label class="label" for="password">  PASSWORD</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Sign in</button>
            <p>Don't have an account? <a href="#"><b>Register here</b></a></p>
        </div>
    </body>
</html>
